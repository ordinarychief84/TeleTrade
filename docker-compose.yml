services:
  postgres:
    image: postgres:16-alpine
    container_name: teletrade-postgres
    environment:
      POSTGRES_USER: teletrade
      POSTGRES_PASSWORD: teletrade
      POSTGRES_DB: teletrade
    ports:
      - "5432:5432"
    volumes:
      - teletrade-pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U teletrade"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: teletrade-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  teletrade-pg:
